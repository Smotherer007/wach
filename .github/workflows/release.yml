name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build (Apple Silicon)
        run: make build
        env:
          GOARCH: arm64
          GOOS: darwin
          CGO_ENABLED: "1"

      - name: Run tests
        run: make test
        env:
          CGO_ENABLED: "1"

      - name: Package
        run: |
          cd bin
          zip -r Wach.app.zip Wach.app
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Wach.app.zip
          generate_release_notes: true
