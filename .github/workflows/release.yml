name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: make build
        env:
          CGO_ENABLED: "1"

      - name: Run tests
        run: make test
        env:
          CGO_ENABLED: "1"

      - name: Create DMG
        run: |
          hdiutil create -volname "Wach" \
            -srcfolder bin/Wach.app \
            -ov -format UDZO \
            bin/Wach.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Wach.dmg
          generate_release_notes: true
